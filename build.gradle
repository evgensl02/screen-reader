plugins {
    id 'java'
    id 'application'
}

group = 'org.evgensl'
version = '1.0-SNAPSHOT'

application {
    mainClass = 'org.evgensl.screenreader.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.github.kwhat:jnativehook:2.2.2'
    implementation 'net.sourceforge.tess4j:tess4j:5.13.0'
    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5-1'
    implementation 'com.googlecode.soundlibs:jlayer:1.0.1-2'
    implementation("org.slf4j:slf4j-api:2.0.17")
    implementation("ch.qos.logback:logback-classic:1.5.18")
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaExec).configureEach {
    jvmArgs "-Dfile.encoding=UTF-8"
}

tasks.register('jpackageImage', Exec) {
    dependsOn 'installDist'
    doFirst {
        delete file("$buildDir/dist/ScreenReader")
    }
    def javaHome = System.getProperty('java.home')
    def libDir = file("$buildDir/install/screen-reader/lib").absolutePath
    def dest = file("$buildDir/dist").absolutePath
    commandLine "$javaHome/bin/jpackage",
            '--type', 'app-image',
            '--name', 'ScreenReader',
            '--input', libDir,
            '--main-jar', "screen-reader-${version}.jar",
            '--main-class', 'org.evgensl.screenreader.Main',
            '--dest', dest,
            '--add-modules', 'java.base,java.desktop,java.logging,java.net.http,java.prefs',
            '--jlink-options', '--compress=2 --strip-debug --no-header-files --no-man-pages',
            '--java-options', '-Dfile.encoding=UTF-8'
}